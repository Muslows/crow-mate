services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ow
      POSTGRES_PASSWORD: ow
      POSTGRES_DB: ow_manager
    ports:
      - "5432:5432"
    volumes:
      - ow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ow -d ow_manager"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ow_pg_data:
